#======================== AIRFLOW ===========================
x-airflow-common: &airflow-common
    image: project-airflow:2.9.3
    build:
        context: .
        dockerfile: docker/airflow/Dockerfile
    environment:
        - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
        - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
        - AIRFLOW__CELERY__BROKER_URL=redis://:@redis:6379/0
        - AIRFLOW__CORE__FERNET_KEY=${_AIRFLOW_FERNET_KEY}
        - AIRFLOW__CORE__LOAD_EXAMPLES=false
        - AIRFLOW_CONN_POSTGRES_WAREHOUSE=${AIRFLOW_CONN_POSTGRES_WAREHOUSE}
        - AIRFLOW_CONN_KAFKA=${AIRFLOW_CONN_KAFKA}
        - AIRFLOW_CONN_MINIO_S3=${AIRFLOW_CONN_MINIO_S3}
    volumes:
        - ./dags:/opt/airflow/dags
        - airflow_logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on: &airflow-common-depends-on
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
services:
    #======================== POSTGRESQL ===========================
    postgres:
        image: postgres:15
        container_name: postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - AIRFLOW_DB=${AIRFLOW_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/01-init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5
    #======================== REDIS ===========================
    redis:
        image: redis:7
        container_name: redis
        restart: unless-stopped
        healthcheck:
            test: [ "CMD-SHELL", "redis-cli ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    #======================== MINIO ===========================
    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        container_name: minio
        restart: unless-stopped
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        healthcheck:
            test: [ "CMD", "mc", "ready", "local" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # Tự động tạo sẵn các bucket khi khởi động
    minio-init:
        container_name: minio-init
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c " mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb -p local/raw local/bronze local/silver local/gold local/checkpoints; exit 0 "
    #======================== KAFKA ===========================
    kafka:
        image: bitnamilegacy/kafka:3.7
        container_name: kafka
        restart: unless-stopped
        ports:
            - "9094:9094"
        environment:
            - KAFKA_CFG_NODE_ID=0
            - KAFKA_CFG_PROCESS_ROLES=controller,broker
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
        volumes:
            - kafka_data:/bitnami/kafka
        healthcheck:
            test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
            interval: 10s
            timeout: 10s
            retries: 5

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        restart: unless-stopped
        ports:
            - "8085:8080"
        environment:
            - KAFKA_CLUSTERS_0_NAME=local
            - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
        depends_on:
            kafka:
                condition: service_healthy

    #======================== AIRFLOW ===========================
    airflow-init:
        <<: *airflow-common
        container_name: airflow-init
        command: >
            bash -c "airflow db migrate && airflow users create --username ${_AIRFLOW_WWW_USER} --password ${_AIRFLOW_WWW_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com"
        depends_on:
            <<: *airflow-common-depends-on

    airflow-webserver:
        <<: *airflow-common
        container_name: airflow-webserver
        restart: unless-stopped
        command: webserver
        ports:
            - "8080:8080"
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 90s
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully
    airflow-scheduler:
        <<: *airflow-common
        container_name: airflow-scheduler
        restart: unless-stopped
        command: scheduler
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully
    airflow-worker:
        <<: *airflow-common
        container_name: airflow-worker
        restart: unless-stopped
        command: celery worker
        # Task của luồng Spark gọi `docker exec spark-master ...` nên worker
        # cần nói chuyện với docker daemon của host qua socket. Phải liệt kê
        # lại các volume của airflow-common vì phép merge anchor ghi đè key
        # `volumes` chứ không gộp.
        volumes:
            - ./dags:/opt/airflow/dags
            - airflow_logs:/opt/airflow/logs
            - /var/run/docker.sock:/var/run/docker.sock
        # gid 115 là group `docker` trên host; thêm vào để tiến trình worker
        # (uid 50000) có quyền đọc ghi socket. Giá trị này phụ thuộc máy host
        # — kiểm tra bằng `getent group docker` và chỉnh nếu khác.
        group_add:
            - "115"
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    #======================== SPARK ===========================
    spark-master:
        image: bitnamilegacy/spark:3.5
        container_name: spark-master
        restart: unless-stopped
        environment:
            - SPARK_MODE=master
        ports:
            - "8081:8080" # Spark Web UI
            - "7077:7077" # Cổng submit jobs
        volumes:
            - ./jobs/spark:/opt/spark-jobs
            # Driver ghi nhật ký sự kiện của mỗi lần chạy vào đây, để Spark
            # History Server đọc lại. Nhờ vậy vẫn xem được sơ đồ stage/task
            # của job ĐÃ CHẠY XONG — điều Spark UI của master không giữ.
            - ./spark-events:/opt/spark-events
    spark-worker:
        image: bitnamilegacy/spark:3.5
        container_name: spark-worker
        restart: unless-stopped
        environment:
            - SPARK_MODE=worker
            - SPARK_MASTER_URL=spark://spark-master:7077
            # Cấp 6 nhân / 4 GB (host có 8 nhân / 11 GB). Cần đủ nhân thật để
            # minh hoạ skew cho trung thực: một task straggler ôm 44% dữ liệu
            # khiến các nhân còn lại ngồi không, và salting mới cho thấy lợi
            # ích rõ khi rải tải ra nhiều nhân.
            - SPARK_WORKER_MEMORY=4G
            - SPARK_WORKER_CORES=6
        depends_on:
            - spark-master
        volumes:
            - ./jobs/spark:/opt/spark-jobs

    # History Server đọc nhật ký sự kiện mà các driver đã ghi, dựng lại giao
    # diện Spark UI cho những job đã kết thúc. Đây là nơi chụp màn hình bằng
    # chứng skew (task lệch) và cải thiện sau tối ưu, vì job Phase 4 chạy
    # nhanh, không kịp mở UI trực tiếp lúc đang chạy.
    spark-history:
        image: bitnamilegacy/spark:3.5
        container_name: spark-history
        restart: unless-stopped
        environment:
            # Trỏ History Server tới thư mục nhật ký sự kiện mà driver ghi ra.
            - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/opt/spark-events
        # Chạy thẳng lớp HistoryServer ở tiền cảnh để container sống cùng nó.
        command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
        ports:
            - "18080:18080" # Spark History Server UI
        volumes:
            - ./spark-events:/opt/spark-events
        depends_on:
            - spark-master

    flink-jobmanager:
        image: flink:1.18-scala_2.12
        container_name: flink-jobmanager
        command: jobmanager
        restart: unless-stopped
        environment:
            - |
              FLINK_PROPERTIES=
              jobmanager.rpc.address: flink-jobmanager
        ports:
            - "8082:8081" # Flink Web UI
        volumes:
            - ./jobs/flink:/opt/flink-jobs
    flink-taskmanager:
        image: flink:1.18-scala_2.12
        container_name: flink-taskmanager
        command: taskmanager
        restart: unless-stopped
        environment:
            - |
              FLINK_PROPERTIES=
              jobmanager.rpc.address: flink-jobmanager
              taskmanager.numberOfTaskSlots: 4
        volumes:
            - ./jobs/flink:/opt/flink-jobs
        depends_on:
            - flink-jobmanager
volumes:
    postgres_data:
    minio_data:
    kafka_data:
    airflow_logs:
